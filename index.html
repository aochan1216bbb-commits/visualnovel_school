<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>料理部ビジュアルノベル Ver0.1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <section id="title-screen" class="screen active">
      <div class="title-card">
        <div class="eyebrow">BROWSER PROTOTYPE</div>
        <h1>料理部ビジュアルノベル</h1>
        <p>Ver0.1 / 4月第1週プロトタイプ</p>
        <button id="new-game-btn" class="primary">ゲーム開始</button>
        <button id="continue-btn" class="secondary">続きから</button>
      </div>
    </section>

    <section id="game-screen" class="screen">
      <header class="topbar">
        <div>
          <div id="date-label">4月 第1週</div>
          <div id="part-label">平日①</div>
        </div>
        <div class="top-actions">
          <button id="status-btn">ステータス</button>
          <button id="save-btn">セーブ</button>
          <button id="title-btn">タイトル</button>
        </div>
      </header>

      <main id="stage">
        <div id="background-label" class="background-label">料理部室</div>
        <div id="character-card" class="character-card hidden">
          <div id="character-avatar" class="avatar">美</div>
          <div>
            <div id="character-name" class="character-name">神谷 美咲</div>
            <div id="character-state" class="character-state">Lv1 / normal</div>
          </div>
        </div>

        <div id="cg-overlay" class="cg-overlay hidden">
          <div class="cg-box">
            <div>EVENT CG PLACEHOLDER</div>
            <strong id="cg-id"></strong>
          </div>
        </div>
      </main>

      <section id="choice-panel" class="choice-panel hidden"></section>

      <section id="dialogue-box" class="dialogue-box hidden">
        <div id="speaker" class="speaker"></div>
        <div id="dialogue-text" class="dialogue-text"></div>
        <button id="next-btn" class="next-btn">次へ ▶</button>
      </section>
    </section>

    <section id="status-screen" class="screen overlay-screen">
      <div class="modal">
        <div class="modal-header">
          <h2>ステータス</h2>
          <button id="close-status-btn">閉じる</button>
        </div>
        <div id="status-table"></div>
      </div>
    </section>

    <section id="ending-screen" class="screen">
      <div class="title-card">
        <div class="eyebrow">VER0.1 COMPLETE</div>
        <h1>4月 第1週 完了</h1>
        <p>週末処理が完了し、4月第2週へ進みました。</p>
        <button id="restart-btn" class="primary">最初から確認</button>
      </div>
    </section>
  </div>

  <script src="data.js"></script>
  <script src="game.js"></script>
</body>
</html>
